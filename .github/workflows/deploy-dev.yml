name: Deploy Lattice API Dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v3

      - name: 🔐 Setup SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no root@52.220.221.2 << 'EOF'
            cd /home/wahyu/Lattice.Api
            git pull origin dev
            echo "Docker containers status after pull:"
            docker compose down
            docker compose up -d --build
          EOF
