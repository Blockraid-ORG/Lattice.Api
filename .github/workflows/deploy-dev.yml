name: Deploy Lattice API Dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v3

      - name: 🔐 Setup SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🧪 Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 wahyu@52.220.221.2 'echo "SSH connection successful"'

      - name: 🚀 Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no wahyu@52.220.221.2 << 'EOF'
            set -e  # Exit on any error
            
            echo "📂 Navigating to project directory..."
            cd /home/wahyu/Lattice.Api
            
            echo "🔄 Pulling latest changes..."
            git pull origin dev
            
            echo "🛑 Stopping existing containers..."
            docker compose down || true
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "📋 Checking environment file..."
            if [ ! -f ".env" ]; then
              echo "⚠️  No .env file found, copying from env template..."
              cp env .env
            fi
            
            echo "🔨 Building and starting containers..."
            docker compose up -d --build
            
            echo "⏳ Waiting for services to be ready..."
            sleep 30
            
            echo "🔍 Checking container status..."
            docker compose ps
            
            echo "📊 Checking logs..."
            docker compose logs --tail=50
            
            echo "✅ Deployment completed successfully!"
          EOF
